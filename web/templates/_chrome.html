{#  Shared page chrome: ambient texture + sticky header with brand + theme toggle.
    Place immediately after <body>. Requires theme.js (loaded before </body>).
    Uses global vars: site_name (always available — see web/app.py jinja globals). #}
<div class="noise" aria-hidden="true"></div>

<header class="site-header">
  <div class="site-header-inner">
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="13" width="3" height="8" rx="1" fill="#0B0F14"/>
          <rect x="7.5" y="9" width="3" height="12" rx="1" fill="#0B0F14"/>
          <rect x="13" y="4" width="3" height="17" rx="1" fill="#0B0F14"/>
          <rect x="18.5" y="10" width="3" height="11" rx="1" fill="#0B0F14"/>
        </svg>
      </span>
      <span class="brand-name">{{ site_name }}</span>
    </a>
    <div class="header-actions">
      <button class="theme-toggle" data-theme-toggle type="button" aria-label="Toggle theme" data-icon="system">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg class="icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8M12 18v2"/></svg>
      </button>
    </div>
  </div>
</header>

<style>
  /* Swap which icon shows based on the toggle's data-icon attribute — set
     by theme.js on load and on every click, kept here (not duplicated per
     page) since every page includes this chrome partial. */
  .theme-toggle[data-icon="sun"] .icon-sun{display:block!important}
  .theme-toggle[data-icon="sun"] .icon-moon,.theme-toggle[data-icon="sun"] .icon-system{display:none!important}
  .theme-toggle[data-icon="moon"] .icon-moon{display:block!important}
  .theme-toggle[data-icon="moon"] .icon-sun,.theme-toggle[data-icon="moon"] .icon-system{display:none!important}
  .theme-toggle[data-icon="system"] .icon-system{display:block!important}
  .theme-toggle[data-icon="system"] .icon-sun,.theme-toggle[data-icon="system"] .icon-moon{display:none!important}
  .theme-toggle svg{width:17px;height:17px}
</style>
